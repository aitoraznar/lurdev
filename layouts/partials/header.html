{{ $logo := resources.Get "images/logo_white_trans.svg" }}
<header>
  <div class="logo-brand">
    <a href="/">
      <picture>
        <source srcset="{{ $logo.Permalink }}" />
        <img
          src="/assets/{{ $logo.Permalink }}"
          alt="logo"
          class="background-image"
        />
      </picture>
    </a>
  </div>
  <nav class="site-nav">
    {{ if .IsHome }}
      <a href="/domotica">Domótica</a>
    {{ else }}
      <a href="/">Inicio</a>
    {{ end }}
  </nav>
</header>
